[project]
name = "shop-lookup"
version = "0.1.0"
description = "Local lookup of grocery product in-store locations, starting with Safeway."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
shop-lookup = "shop_lookup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_lookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
