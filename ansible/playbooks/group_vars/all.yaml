# Populated incrementally as later tasks create Bitwarden Secrets Manager entries.
# Each lookup below is added by the task that first needs it — see per-task steps
# in docs/superpowers/plans/2026-09-10-moltron-mvp.md.

# Not a Bitwarden secret, but still not something to commit literally — it
# identifies a specific real Telegram account. Sourced from .env like DOMAIN.
telegram_allowed_user_id: "{{ lookup('env', 'TELEGRAM_ALLOWED_USER_ID') }}"

domain: "{{ lookup('env', 'DOMAIN') }}"

# warden's LAN IP (homelab repo) — the only host allowed to reach the gateway
# port directly, since its Caddy instance is what fronts it with TLS. Moved
# here from vm100 during the vm100->warden migration (homelab #86); see
# docs/superpowers/specs/2026-09-11-openclaw-gateway-tls-design.md for the
# original design (written when vm100 held this role).
openclaw_gateway_proxy_ip: "192.168.10.12"
openclaw_gateway_port: 18789

moltron_bot_pat: "{{ lookup('bitwarden.secrets.lookup', 'db72e78b-0a94-4600-94c7-b4c101244310') }}"
moltron_bot_git_email: "{{ lookup('env', 'MOLTRON_BOT_GIT_EMAIL') }}"

# Dedicated rclone Dropbox app (issue #35) — separate from the existing
# Dropbox app used for backups. Full-account access, not App-Folder-scoped.
# App key/secret come from the Dropbox App Console (Bitwarden items
# dropbox_rclone_app_key / dropbox_rclone_app_secret); token comes from a
# one-time interactive `rclone authorize` run by hand (see
# docs/rclone-dropbox.md) — none of this can be produced headlessly by
# Ansible. This "token" value must be the FULL JSON blob `rclone authorize`
# prints (access_token + refresh_token + expiry, etc.), not a bare
# access_token string — see docs/rclone-dropbox.md.
dropbox_rclone_client_id: "{{ lookup('bitwarden.secrets.lookup', '620d89ff-b271-4970-97b2-b4c701484af0') }}"
dropbox_rclone_client_secret: "{{ lookup('bitwarden.secrets.lookup', '54d2f46c-80fc-459c-b424-b4c701486737') }}"
dropbox_rclone_token: "{{ lookup('bitwarden.secrets.lookup', '6eff6c94-c68d-4bd0-8351-b4c70149b33d') }}"
