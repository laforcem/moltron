- name: Install Node.js 24.x (nodesource)
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install nodejs
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install dbus-user-session (required for systemd --user gateway install)
  ansible.builtin.apt:
    name: dbus-user-session
    state: present
  register: dbus_user_session_install

- name: Look up moltron's UID
  ansible.builtin.getent:
    database: passwd
    key: moltron

- name: Restart moltron's user manager to pick up dbus-user-session
  ansible.builtin.command:
    cmd: "systemctl restart user@{{ ansible_facts.getent_passwd.moltron[1] }}.service"
  when: dbus_user_session_install.changed

- name: Install OpenClaw globally (as moltron)
  become: true
  become_user: moltron
  ansible.builtin.command:
    cmd: npm install -g openclaw@latest --allow-scripts=openclaw --prefix ~moltron/.local
    creates: /home/moltron/.local/bin/openclaw

- name: Lock down Telegram to a single-user allowlist
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - 'openclaw config set channels.telegram.dmPolicy "allowlist"'
    - 'openclaw config set channels.telegram.allowFrom ''["{{ telegram_allowed_user_id }}"]'''
  notify: Restart openclaw gateway

- name: Register actual-mcp remote server
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - 'openclaw config set mcp.servers.actual.url "https://budget.{{ domain }}/mcp/http"'
    - 'openclaw config set mcp.servers.actual.transport "streamable-http"'
  notify: Restart openclaw gateway

- name: Set actual-mcp auth header
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: >-
      openclaw config set mcp.servers.actual.headers
      '{"Authorization": "Bearer {{ actual_mcp_token }}"}'
  no_log: true
  notify: Restart openclaw gateway

- name: Bind gateway to LAN for mobile app pairing
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: 'openclaw config set gateway.bind "lan"'
  notify: Restart openclaw gateway

- name: Enable gateway TLS (self-signed, terminated again by vm100's Caddy)
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: 'openclaw config set gateway.tls.enabled true'
  notify: Restart openclaw gateway

- name: Trust vm100 as the gateway's reverse proxy
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: 'openclaw config set gateway.trustedProxies ''["{{ openclaw_gateway_proxy_ip }}"]'''
  notify: Restart openclaw gateway

- name: Restrict gateway port to vm100 only
  community.general.ufw:
    rule: allow
    from_ip: "{{ openclaw_gateway_proxy_ip }}"
    port: "{{ openclaw_gateway_port | string }}"
    proto: tcp

- name: Allow the Control UI's real origin through the gateway
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: 'openclaw config set gateway.controlUi.allowedOrigins ''["https://openclaw.lan.{{ domain }}"]'''
  notify: Restart openclaw gateway

- name: Set the gateway's remote URL for domain-based QR pairing
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: 'openclaw config set gateway.remote.url "wss://openclaw.lan.{{ domain }}/ws"'
  notify: Restart openclaw gateway

- name: Install OpenMP runtime (required by the managed llama.cpp server)
  ansible.builtin.apt:
    name: libgomp1
    state: present

- name: Configure OpenClaw memory search to use local CPU embeddings
  become: true
  become_user: moltron
  environment:
    PATH: "/home/moltron/.local/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - 'openclaw config set memory.search.provider "local"'
    - 'openclaw config set memory.search.local.modelPath "embeddinggemma-300m-qat-Q8_0.gguf"'
  notify: Restart openclaw gateway
