- name: Install Node.js 24.x (nodesource)
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install nodejs
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install dbus-user-session (required for systemd --user gateway install)
  ansible.builtin.apt:
    name: dbus-user-session
    state: present
  register: dbus_user_session_install

- name: Look up moltron's UID
  ansible.builtin.getent:
    database: passwd
    key: moltron
  when: dbus_user_session_install.changed

- name: Restart moltron's user manager to pick up dbus-user-session
  ansible.builtin.command:
    cmd: "systemctl restart user@{{ ansible_facts.getent_passwd.moltron[1] }}.service"
  when: dbus_user_session_install.changed

- name: Install OpenClaw globally (as moltron)
  become: true
  become_user: moltron
  ansible.builtin.command:
    cmd: npm install -g openclaw@latest --allow-scripts=openclaw --prefix ~moltron/.npm-global
    creates: /home/moltron/.npm-global/bin/openclaw

- name: Add npm-global bin to moltron's PATH
  become: true
  become_user: moltron
  ansible.builtin.lineinfile:
    path: /home/moltron/.bashrc
    line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
    create: true
