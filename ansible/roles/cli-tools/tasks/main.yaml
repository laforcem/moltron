# Basic CLI utilities the agent shells out to via `exec` — assumed present
# on a mature system for a human, but not guaranteed on a minimal cloud-init
# Debian image, and not something homelab's `common` role (every host,
# human/service-generic) is the right place for.
# sqlite3: SQLite CLI. libimage-exiftool-perl: `exiftool` (read/write image
# metadata). exif: lightweight EXIF-only reader/editor.
- name: Install baseline CLI tools
  ansible.builtin.apt:
    name:
      - jq
      - curl
      - wget
      - ripgrep
      - tree
      - htop
      - unzip
      - rsync
      - less
      - vim
      - sqlite3
      - libimage-exiftool-perl
      - exif
    state: present
    update_cache: true
