- name: Install obsidian-headless globally (as moltron)
  become: true
  become_user: moltron
  ansible.builtin.command:
    cmd: npm install -g obsidian-headless --prefix ~moltron/.local
    creates: /home/moltron/.local/bin/ob

- name: Create Obsidian sync systemd unit directory
  become: true
  become_user: moltron
  ansible.builtin.file:
    path: /home/moltron/.config/systemd/user
    state: directory
    mode: "0755"

- name: Install Obsidian sync systemd service
  become: true
  become_user: moltron
  ansible.builtin.copy:
    dest: /home/moltron/.config/systemd/user/obsidian-sync.service
    mode: "0644"
    content: |
      [Unit]
      Description=Obsidian headless sync (continuous)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/home/moltron/obsidian
      Environment=PATH=/home/moltron/.local/bin:/usr/bin:/bin
      ExecStart=/home/moltron/.local/bin/ob sync --continuous
      Restart=on-failure
      RestartSec=10
      TimeoutStartSec=30

      [Install]
      WantedBy=default.target
  notify: Reload moltron systemd user daemon

- name: Create Obsidian vault working directory
  become: true
  become_user: moltron
  ansible.builtin.file:
    path: /home/moltron/obsidian
    state: directory
    mode: "0700"
